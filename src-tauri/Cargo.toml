[package]
name = "fpv-endurance"
version = "0.7.4"
description = "Offline FPV flight endurance reference tool"
authors = ["FPV Endurance"]
edition = "2021"

[lib]
name = "fpv_endurance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
